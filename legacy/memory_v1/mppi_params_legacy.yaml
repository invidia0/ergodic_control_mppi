# Run-level settings
seed: 43
steps: 20000

# MPPI controller settings
mppi:
  T: 350  # planning horizon
  K: 1000 # number of rollouts
  lambda: 1.0
  alpha: 0.95       # control-cost weight; (1-alpha) is temperature-independent, so at long T it must be high to keep ESS healthy
  exploration: 0.1  # fraction of rollouts that ignore warm-start controls
  ess_target: 0.3   # target effective sample size fraction for adaptive lambda
  lam_min: 0.05
  lam_max: 20.0
  memory_length: 2000  # executed-position buffer; recency-weighted (gamma**age) repulsion; long enough to fill a mode in one visit
  noise:
    sigma:
      - [0.9, 0.0, 0.0]  # linear x  (tighter sampling => cleaner flow tracking / dwelling)
      - [0.0, 0.9, 0.0]  # linear y
      - [0.0, 0.0, 0.45] # angular
      # - [3.0, 0.0, 0.0]  # linear x  (tighter sampling => cleaner flow tracking / dwelling)
      # - [0.0, 3.0, 0.0]  # linear y
      # - [0.0, 0.0, 1.5] # angular

# Map and obstacle costs
map:
  x_limits: [-10.0, 10.0]
  y_limits: [-10.0, 10.0]
  resolution: 0.2  # visualization grid resolution
  oom_cost: 1e3
  boundary_margin: 1.5   # soft inward margin band [m] near map edges
  boundary_weight: 100.0 # penalty for hugging the inside of the edge (stops corner-dwelling, frees far modes)

  obstacles:
    num_obstacles: 3
    min_radius: 0.5
    max_radius: 1.5
    x_limits: [-8.0, 8.0]
    y_limits: [-8.0, 8.0]
    weight: 1e3
    safe_distance: 0.3

# Target density p(x): Gaussian mixture in R^2
density:
  weights:
    - 0.33333334
    - 0.33333334
    - 0.33333334
  means:
    - [0.0, 6.0]
    - [-6.0, -4.0]
    - [6.0, -4.0]
  covariances:
    - [[3.0, 0.0], [0.0, 2.0]]
    - [[2.0, 1.0], [1.0, 3.0]]
    - [[2.0, -1.0], [-1.0, 3.0]]

# Stein flow settings
stein:
  theta: 30.0  # degrees: 0 = pure score-descent, 90 = pure curl; 30 => direct transits, reaches all modes
  weight_stein: 3000.0         # flow-tracking weight; must dominate control/obstacle costs to actually dwell
  ell_self: 1.0             # floor under the adaptive median RBF bandwidth
  repulsion_weight: 15.0       # coarse eject strength; gated by fill-completeness (eject_fill_gated) so it can be strong without leaving early
  repulsion_bandwidth: 3.0     # RBF bandwidth for the coarse (eject/distribute) memory repulsion
  memory_decay: 0.999          # gamma: recency weight gamma**age (tau ~ 1/(1-gamma) ~ 1000 steps); long enough to fill a mode before forgetting
  reference_speed: 4.0         # >0 => track flow DIRECTION at this constant speed (LQR style); 0 => raw magnitude. 4 = 20k-horizon optimum
  spiral_bandwidth: 0.3        # fine RBF bandwidth for the within-mode spiral-fill term
  spiral_weight: 10.0          # strength of the fine spiral-fill repulsion (0 disables)
  # Frozen design toggles (deficit_gate=1, spiral_deficit=0, eject_fill_gated=1) are the settled
  # winners from the Phase 1/3/4 ablations; they now default to those values in config.py. Set them
  # explicitly only in an ablation config to sweep them; the main run leaves them hardcoded.

model:
  delta_t: 0.02  # source of truth for integration timestep
  double_integrator:
    max_accel_lin_abs: 15.0
    max_accel_ang_abs: 15.0
