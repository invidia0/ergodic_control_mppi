scenario_name: literature_comparison
scenario_config_path: configs/mppi_params.yaml

output_csv_path: results/dars2026/literature/literature_comparison.csv
summary_csv_path: results/dars2026/literature/literature_comparison_summary.csv
convergence_csv_path: results/dars2026/literature/literature_comparison_convergence.csv
plot_output_dir: results/dars2026/literature/plots

steps: 5000
seeds: [0, 1, 2]
d_thresh: 1.0

methods: [mppi, smc, hedac, traj_opt, dec]

fourier_order: 5
desired_speed: 1.5
tracker_gain: 3.0
smc_gain: 2.5
dec_gain: 2.5

hedac:
  grid_size: 80
  jacobi_iterations: 60
  diffusion_gain: 1.0
  damping: 0.2
  gradient_gain: 8.0

traj_opt:
  iterations: 80
  learning_rate: 0.08
  control_weight: 1.0e-4
  smoothness_weight: 5.0e-4
  bounds_weight: 10.0

scenarios:
  - name: unimodal
    weights: [1.0]
    means:
      - [0.0, 0.0]
    covariances:
      - [[6.0, 0.0], [0.0, 6.0]]

  - name: bimodal
    weights: [0.5, 0.5]
    means:
      - [-5.0, 0.0]
      - [5.0, 0.0]
    covariances:
      - [[2.5, 0.0], [0.0, 2.5]]
      - [[2.5, 0.0], [0.0, 2.5]]

  - name: trimodal
    weights: [0.33333334, 0.33333334, 0.33333334]
    means:
      - [0.0, 6.0]
      - [-6.0, -4.0]
      - [6.0, -4.0]
    covariances:
      - [[3.0, 0.0], [0.0, 2.0]]
      - [[2.0, 1.0], [1.0, 3.0]]
      - [[2.0, -1.0], [-1.0, 3.0]]

  - name: four_mode
    weights: [0.25, 0.25, 0.25, 0.25]
    means:
      - [-6.0, 6.0]
      - [6.0, 6.0]
      - [-6.0, -6.0]
      - [6.0, -6.0]
    covariances:
      - [[2.0, 0.0], [0.0, 2.0]]
      - [[2.0, 0.0], [0.0, 2.0]]
      - [[2.0, 0.0], [0.0, 2.0]]
      - [[2.0, 0.0], [0.0, 2.0]]
