seed: 43 # 0, 42, 99, 35, 213

steps: 10000

num_robots: 1
beta: 10.0

gamma_uld: 0.5

theta: 0.47

w_uld: 10.0

w_mag: 1.0

w_rate: 1.0

mppi:
  T: 50 # Default for K_N is 30
  K: 1000 # Default for T_K is 500
  lambda: 0.3 # this is the temperature parameter higher = more exploration, lower = more exploitation
  alpha: 0.2 # control cost weight, higher = less control effort, lower = more control effort
  exploration: 0.1 # fraction of rollouts using nominal control
  ess_target: 0.3  # target effective sample size fraction; lambda auto-tunes to hit this
  lam_min: 0.05    # minimum allowed temperature
  lam_max: 10.0    # maximum allowed temperature
  dim_x: 4
  dim_u: 2
  noise:
    # If sigma is present, it is used as explicit hand-tuned covariance.
    # If sigma is omitted, loader builds auto covariance with
    # Sigma_lin = 2*gamma_uld/(beta*model.delta_t) * I on the first 2 control dims.
    # For dim_u > 2, trailing diagonal entries use sigma_ang_factor * Sigma_lin.
    sigma_ang_factor: 1.0
    # sigma: None
    sigma:
      - [10.0, 0.0] # linear x
      - [0.0, 10.0] # linear y
      # - [0.0, 0.0, 3] # angular

map:
  x_limits: [-10.0, 10.0]
  y_limits: [-10.0, 10.0]
  resolution: 0.2
  oom_cost: 1e8

  obstacles:
    num_obstacles: 1
    min_radius: 0.5
    max_radius: 1.5
    x_limits: [-8.0, 8.0]
    y_limits: [-8.0, 8.0]
    weight: 1e8
    safe_distance: 0.3

density:
  weights:
    - 0.33333334
    - 0.33333334
    - 0.33333334
  means:
    - [0.0, 6.0]      # Top center
    - [-6.0, -4.0]    # Bottom left
    - [6.0, -4.0]     # Bottom right
  covariances:
    - [[3.0, 0.0], [0.0, 2.0]]   # Horizontal ellipse
    - [[2.0, 1.0], [1.0, 3.0]]   # Tilted
    - [[2.0, -1.0], [-1.0, 3.0]] # Tilted opposite


model:
  delta_t: 0.02 # source of truth timestep for both simulation integration and MPPI diffusion matching
  double_integrator:
    max_accel_lin_abs: 15.0 # m/s²
    max_accel_ang_abs: 15.0 # rad/s²