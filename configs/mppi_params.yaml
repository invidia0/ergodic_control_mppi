# Run-level settings
seed: 43
steps: 20000

# MPPI controller settings
mppi:
  T: 350  # planning horizon
  K: 1000 # number of rollouts
  lambda: 1.0
  alpha: 0.95       # control-cost weight; (1-alpha) is temperature-independent, so at long T it must be high to keep ESS healthy
  exploration: 0.1  # fraction of rollouts that ignore warm-start controls
  ess_target: 0.3   # target effective sample size fraction for adaptive lambda
  lam_min: 0.05
  lam_max: 20.0
  # memory_length is derived as ceil(3 * memory_time / delta_t); set it here only to
  # override that (the occupancy KDE is O(memory_scales * P^2), so P dominates cost).
  noise:
    sigma:
      - [0.9, 0.0, 0.0]  # linear x  (tighter sampling => cleaner flow tracking / dwelling)
      - [0.0, 0.9, 0.0]  # linear y
      - [0.0, 0.0, 0.45] # angular

# Map and obstacle costs
map:
  x_limits: [-20.0, 20.0]
  y_limits: [-10.0, 10.0]
  resolution: 0.15  # visualization grid resolution
  oom_cost: 1e3
  boundary_margin: 1.5   # soft inward margin band [m] near map edges
  boundary_weight: 100.0 # penalty for hugging the inside of the edge (stops corner-dwelling, frees far modes)

  obstacles:
    num_obstacles: 3
    min_radius: 0.5
    max_radius: 1.5
    x_limits: [-16.0, 16.0]
    y_limits: [-8.0, 8.0]
    weight: 1e3
    safe_distance: 0.3

# Target density p(x): Gaussian mixture in R^2
density:
  weights:
    - 0.33333334
    - 0.33333334
    - 0.33333334
  means:
    - [0.0, 6.0]
    - [-12.0, -4.0]
    - [12.0, -4.0]
  covariances:
    - [[12.0, 0.0], [0.0, 2.0]]
    - [[8.0, 2.0], [2.0, 3.0]]
    - [[8.0, -2.0], [-2.0, 3.0]]

# Stein flow settings
stein:
  theta: 30.0  # degrees: 0 = pure score-descent, 90 = pure curl; 30 => direct transits, reaches all modes
  weight_stein: 3000.0      # flow-tracking weight; must dominate control/obstacle costs to actually dwell
  ell_self: 1.0             # floor under the adaptive median RBF bandwidth
  reference_speed: 4.0      # >0 => track flow DIRECTION at this constant speed (LQR style); 0 => raw magnitude

  # Fading-memory coverage feedback: three free parameters, spatial scales derived.
  memory_time: 10.0         # tau_M [s]: decay exp(-dt/tau), buffer P = ceil(3 tau/dt)
  memory_balance: 0.85      # a in [0, 1]: 0 = pure trail avoidance, 1 = pure over-coverage correction
  memory_gain: 15.0         # k_M: memory strength as a ratio to the attraction (implicit weight 1)
  memory_scales: 3          # Q log-spaced scales between the fine and coarse bandwidths
  fill_resolution: 0.2      # delta_res [m]: sensor footprint / track spacing => h_f = 2 delta_res^2
  # coarse_bandwidth (h_c) defaults to the mode width median_j tr(Sigma_j) -- repulsion
  # peaks one mode radius out, the same sqrt(h/2) convention as h_f -- capped at
  # 0.25*min_{r!=s} ||mu_r - mu_s||^2 so it never merges neighbouring modes.
  # Set coarse_bandwidth / fine_bandwidth explicitly only to override the derivation.

model:
  delta_t: 0.02  # source of truth for integration timestep
  double_integrator:
    max_accel_lin_abs: 15.0
    max_accel_ang_abs: 15.0
