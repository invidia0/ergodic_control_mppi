# Run-level settings
seed: 43
steps: 5000

# Multi-robot toggle: set to 1 for single-robot mode.
robots:
  num_robots: 4

# MPPI controller settings
mppi:
  T: 350
  K: 1000
  lambda: 1.0
  alpha: 0.2        # control-cost scaling term in MPPI importance weighting
  exploration: 0.1  # fraction of rollouts that ignore warm-start controls
  ess_target: 0.3   # target effective sample size fraction for adaptive lambda
  lam_min: 0.05
  lam_max: 20.0
  history_len: 1000  # length of executed-position history included in Stein particles
  dim_x: 6
  dim_u: 3
  noise:
    sigma:
      - [6.0, 0.0, 0.0]  # linear x
      - [0.0, 6.0, 0.0]  # linear y
      - [0.0, 0.0, 3.0]  # angular

# Map and obstacle costs
map:
  x_limits: [-10.0, 10.0]
  y_limits: [-10.0, 10.0]
  resolution: 0.2  # visualization grid resolution
  oom_cost: 1e8

  obstacles:
    num_obstacles: 3
    min_radius: 0.5
    max_radius: 1.5
    x_limits: [-8.0, 8.0]
    y_limits: [-8.0, 8.0]
    weight: 1e8
    safe_distance: 0.3

# Target density p(x): Gaussian mixture in R^2
density:
  weights:
    - 0.33333334
    - 0.33333334
    - 0.33333334
  means:
    - [0.0, 6.0]
    - [-6.0, -4.0]
    - [6.0, -4.0]
  covariances:
    - [[3.0, 0.0], [0.0, 2.0]]
    - [[2.0, 1.0], [1.0, 3.0]]
    - [[2.0, -1.0], [-1.0, 3.0]]

# Stein flow settings
stein:
  weight_stein: 2228.2492276014987
  weight_pdf: 0.0
  ell_self: 4.0        # self bandwidth floor; runtime uses median heuristic with this floor
  ell_x: 16.565452675970764  # fixed cross-robot bandwidth; sqrt(ell_x) is an interaction distance scale
  alpha_cross: 12.633417458693733 # scaling on cross-robot Stein gradient
  theta: 54.97752282732397   # degrees: 0 = pure score-descent, 90 = pure curl

model:
  delta_t: 0.02  # source of truth for integration timestep
  double_integrator:
    max_accel_lin_abs: 15.0
    max_accel_ang_abs: 15.0
