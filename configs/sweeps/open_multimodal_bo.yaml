scenario_name: open_multimodal_bo
scenario_config_path: configs/mppi_params.yaml
output_csv_path: results/dars2026/bo/open_multimodal_bo_run2.csv

# Optuna study config.
study_name: open_multimodal_bo
storage: sqlite:///results/dars2026/bo/open_multimodal_bo.db
sampler_seed: 0
n_trials: 80
n_startup_trials: 20
n_jobs: 1

# Controller/runtime settings for each trial.
team_size: 4
steps: 5000

# Ergodic-first BO with fixed seeds.
search_seeds: [0, 1]
reeval_seeds: [0, 1, 2, 3, 4]
reeval_top_n: 10

# Optional safety penalty (set both keys to null to disable).
safety_max: null
safety_penalty: null

include_baseline: true

# Continuous search spaces.
alpha_cross:
  low: 1.0
  high: 20.0
  log: true
ell_x:
  low: 1.0
  high: 25.0
  log: true
weight_stein:
  low: 1.0
  high: 10000.0
  log: true
theta:
  low: 0.0
  high: 90.0
  log: false

# Structural discrete choices.
history_window_values: [1, 50, 100, 500, 1000]
horizon_values: [100, 150, 250, 300, 350]
