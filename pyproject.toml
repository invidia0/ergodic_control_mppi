[project]
name = "ergodic_control_mppi"
version = "0.1.0"
description = "Service-gated potential-gradient MPPI for single-robot ergodic coverage"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cmcrameri>=1.9",
    "jax>=0.11.0",
    "matplotlib>=3.10.8",
    "numpy>=2.2.6,<2.4",
    "pyyaml>=6.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
cuda13 = ["jax[cuda13]>=0.11.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
