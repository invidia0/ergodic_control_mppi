[project]
name = "ergodic_control_mppi"
version = "0.1.0"
description = "Flow-matching MPPI for single- and multi-robot ergodic coverage"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jax",
    "matplotlib>=3.10.8",
    "numpy>=2.2.6,<2.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
cuda12 = ["jax[cuda12]"]
experiments = ["optuna>=4.5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
