# Ergodic MPPI mission node. From this directory:
#   cp .env.example .env   # set DRONE_ID to this drone's heartbeat drone_id
#   docker compose up -d --build
services:
  ergodic_mission:
    build:
      context: ../..
      dockerfile: docker/mission/Dockerfile
      args:
        PX4_MSGS_REF: ${PX4_MSGS_REF:-release/1.17}
    image: ergodic-mission:latest
    container_name: ergodic-mission
    # Same host network, domain and RMW as mullet_core's container, so DDS discovery works.
    network_mode: host
    runtime: nvidia
    restart: unless-stopped
    mem_limit: 4g
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      NVIDIA_DISABLE_REQUIRE: "1"
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      DRONE_ID: ${DRONE_ID:?set DRONE_ID in docker/mission/.env}
